[project]
name = "siq2long"
version = "0.1.0"
description = "Retrieval-first video QA on Social-IQ 2.0: oracle-clip finding and long-video evaluation"
requires-python = ">=3.12"
dependencies = [
    "accelerate",     # device_map="auto"
    # data.utils.sample_frames. Marker because decord 0.6.0 ships only manylinux2010_x86_64
    # and win_amd64 wheels -- nothing for macOS, and the eva-decord fork has no arm64 build
    # either. Frame *decoding* therefore happens on the Linux box only; sample_frames imports
    # decord lazily so the rest of the package stays importable on a laptop without it.
    "decord ; sys_platform != 'darwin'",
    "matplotlib",     # plots
    "numpy",          # imported directly by data.utils, not just via torch/pandas
    "pandas",
    "python-dotenv",
    "qwen-vl-utils",
    "torch",
    "torchcodec",     # FORCE_QWENVL_VIDEO_READER
    "tqdm",
    "transformers",
    "webvtt-py",
]

[dependency-groups]
dev = ["pytest", "ipykernel", "seaborn"]  # ipykernel/seaborn: notebooks/ only
# scripts/download_all.py only. Nothing under src/ imports these, so the eval path
# installs without them; lxml is required because youtube_utils asks BeautifulSoup
# for the 'lxml' parser by name.
download = ["beautifulsoup4", "lxml", "yt-dlp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ is the import root, so modules are `config`, `inference`, `vlm.*`, `data.*`
# with no package prefix. Deliberately no src/__init__.py: if the repo root were
# also importable, `vlm.base` and `src.vlm.base` would be two distinct modules
# and isinstance checks against VLM would fail across them.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["config", "inference"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
